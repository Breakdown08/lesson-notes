[project]
name = "lesson-notes"
version = "0.1.0"
description = "Turn a two-track lesson recording into a transcript and a short summary"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.8,<2",
    "langchain-xai>=1.4,<2",
    "langchain-anthropic>=1.7,<2",
    "faster-whisper>=1.2,<2",
    "av>=14",
    "python-dotenv>=1.0",
]

[project.scripts]
lesson-notes = "lesson_notes.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.7",
    "ty>=0.0.1a",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

# Every variable, parameter and return value is typed. ty is the reference checker;
# tests/test_annotations.py covers variables, which no checker requires.
[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/lesson_notes"]
